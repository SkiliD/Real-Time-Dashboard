# DevDash CI: prove the CLI + core + GUI server work on all three desktop OSes.
# The native-window test needs a display, so it is skipped on headless CI by design
# (the HTTP-level GUI tests still run everywhere).
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (test extra only; GUI native window needs system webkit on Linux)
        run: python -m pip install -e ".[test]"
      - name: Smoke — CLI help works
        run: python -m devdash --help
      - name: Test suite
        run: python -m pytest -q

  gui-build-smoke:
    # the [gui] and [build] extras are not installed in the matrix above: prove
    # they still import and the build command is wired (no full PyInstaller run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (gui + build extras)
        run: python -m pip install -e ".[gui,build]"
      - name: pywebview imports
        run: python -c "import webview; print(webview.__version__ if hasattr(webview, '__version__') else 'ok')"
      - name: Smoke — build command help
        run: python -m devdash build --help
      - name: Smoke — gui command help
        run: python -m devdash gui --help
